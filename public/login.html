<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- Captura beforeinstallprompt o mais cedo possível -->
  <script>
    window.__pwaPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window.__pwaPrompt = e;
      // Notifica o botão se já estiver no DOM
      document.dispatchEvent(new CustomEvent('pwa-ready'));
    });
    window.addEventListener('appinstalled', function() {
      window.__pwaPrompt = null;
      localStorage.setItem('pwa_installed', '1');
      document.dispatchEvent(new CustomEvent('pwa-installed'));
    });
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D0D0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PROSPEKT CRM">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="description" content="PROSPEKT CRM — Plataforma de gestão de relacionamento com clientes enterprise">
  <title>Login — PROSPEKT CRM</title>
  <link rel="stylesheet" href="/css/design-system.css">
<link rel="stylesheet" href="/css/mobile.css">
  <style>
    /* ── Login Page ─────────────────────────────────────── */
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      /* NÃ£O usar overflow:hidden — quebra min-height em Safari/Chrome */
      overflow-x: hidden;
      position: relative;
      padding: 0 !important;
      box-sizing: border-box;
    }

    /* Background noise + gradients */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        var(--grad-glow-green),
        var(--grad-glow-pink),
        var(--bg);
      z-index: 0;
    }

    /* Floating orbs */
    .orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.15;
      pointer-events: none;
      z-index: 0;
    }

    .orb-1 {
      width: 500px; height: 500px;
      background: var(--green);
      top: -200px; left: -200px;
      animation: float 12s ease-in-out infinite;
    }

    .orb-2 {
      width: 400px; height: 400px;
      background: var(--pink);
      bottom: -150px; right: -150px;
      animation: float 10s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33%       { transform: translate(30px, -20px) scale(1.05); }
      66%       { transform: translate(-20px, 30px) scale(0.97); }
    }

    /* Login wrapper — centralizado com margin:auto */
    .login-wrapper {
      position: relative;
      z-index: 1;
      /* Largura responsiva: 420px no desktop, segura no mobile */
      width: min(420px, calc(100vw - 32px));
      max-width: 100%;
      /* margin:auto é a técnica mais robusta para centralizar em flex column */
      margin: auto;
      /* Padding vertical para não encostar no topo/fundo */
      padding: var(--space-4) 0;
      box-sizing: border-box;
      animation: fadeIn 0.5s cubic-bezier(0.16,1,0.3,1);
    }

    .login-card {
      background: rgba(22,22,22,0.75);
      backdrop-filter: blur(32px);
      -webkit-backdrop-filter: blur(32px);
      border: 1px solid var(--border-hover);
      border-radius: var(--radius-xl);
      padding: var(--space-10) var(--space-8);
      box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,0.04);
      /* Garante que não vaze para fora do wrapper */
      width: 100%;
      box-sizing: border-box;
    }

    /* Logo */
    .login-logo {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .login-logo .brand {
      display: inline-flex;
      align-items: center;
      gap: var(--space-3);
      margin-bottom: var(--space-3);
    }

    .logo-mark {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    .logo-mark img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .brand-name {
      font-size: 1.375rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--grad-brand);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-title {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    /* Form */
    .login-form {
      display: flex;
      flex-direction: column;
      gap: var(--space-5);
    }

    .input-with-icon {
      position: relative;
    }

    .input-with-icon .input-icon {
      position: absolute;
      left: var(--space-4);
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      transition: var(--transition-fast);
    }

    .input-with-icon .input {
      padding-left: 42px;
    }

    .input-with-icon:focus-within .input-icon { color: var(--green); }

    /* Toggle password */
    .toggle-password {
      position: absolute;
      right: var(--space-4);
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 0;
      transition: var(--transition-fast);
    }

    .toggle-password:hover { color: var(--text-primary); }

    /* Submit */
    #btn-login {
      width: 100%;
      padding: var(--space-4);
      font-size: 0.9375rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      position: relative;
      overflow: hidden;
    }

    #btn-login::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }

    #btn-login:hover::after { transform: translateX(100%); }

    /* Error message */
    #login-error {
      padding: var(--space-3) var(--space-4);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      background: rgba(255,59,92,0.1);
      border: 1px solid rgba(255,59,92,0.25);
      color: #ff6b6b;
      display: none;
      align-items: center;
      gap: var(--space-2);
      animation: fadeIn 0.3s ease;
    }

    #login-error.visible { display: flex; }

    /* Footer info */
    .login-footer {
      margin-top: var(--space-6);
      text-align: center;
      font-size: 0.8125rem;
      color: var(--text-muted);
    }

    .login-footer .version {
      display: inline-flex;
      align-items: center;
      gap: var(--space-1);
    }

    .version-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
    /* ── Login: sobrescreve padding do mobile.css global ──────── */
    /* O mobile.css aplica padding-top/bottom !important no body  */
    /* Já anulado pelo padding:0!important acima no body            */

    /* Oculta header/nav mobile injetados pelo mobile-nav.js */
    #mobile-header,
    #mobile-bottom-nav {
      display: none !important;
    }

    /* ── PWA Install Bar ────────────────────────────────────────── */
    #pwa-install-bar {
      margin-top: var(--space-3);
      border-radius: var(--radius-lg);
      overflow: hidden;
      /* Não pode ser mais largo que o wrapper */
      width: 100%;
      box-sizing: border-box;
      animation: fadeIn 0.4s ease 0.8s both;
    }

    /* Estado: botão instalar (Chrome/Android/Edge) */
    .pwa-bar-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 11px 14px;
      background: rgba(91,222,62,0.07);
      border: 1px solid rgba(91,222,62,0.20);
      border-radius: var(--radius-lg);
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s, border-color 0.15s;
      text-align: left;
      position: relative;
    }
    .pwa-bar-btn:hover {
      background: rgba(91,222,62,0.13);
      border-color: rgba(91,222,62,0.38);
    }
    .pwa-bar-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      flex-shrink: 0;
      object-fit: cover;
    }
    .pwa-bar-text {
      flex: 1;
      min-width: 0;
    }
    .pwa-bar-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1.2;
      margin-bottom: 1px;
    }
    .pwa-bar-sub {
      font-size: 0.68rem;
      color: rgba(255,255,255,0.45);
      line-height: 1.3;
    }
    .pwa-bar-cta {
      flex-shrink: 0;
      padding: 6px 13px;
      background: linear-gradient(135deg, #5BDE3E, #3fcf1e);
      border: none;
      border-radius: 20px;
      color: #0A0A0A;
      font-weight: 800;
      font-size: 0.72rem;
      cursor: pointer;
      font-family: inherit;
      white-space: nowrap;
      pointer-events: none; /* clicável via wrapper */
    }
    .pwa-bar-dismiss {
      position: absolute;
      top: 5px;
      right: 7px;
      background: none;
      border: none;
      color: rgba(255,255,255,0.25);
      font-size: 0.65rem;
      cursor: pointer;
      padding: 3px 5px;
      line-height: 1;
      font-family: inherit;
      transition: color 0.15s;
    }
    .pwa-bar-dismiss:hover { color: rgba(255,255,255,0.6); }

    /* Estado: instrução iOS */
    .pwa-bar-ios {
      padding: 11px 14px;
      background: rgba(91,222,62,0.06);
      border: 1px solid rgba(91,222,62,0.15);
      border-radius: var(--radius-lg);
      position: relative;
    }
    .pwa-bar-ios-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .pwa-bar-ios-steps {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.5);
      line-height: 1.6;
    }
    .pwa-bar-ios-steps strong {
      color: rgba(255,255,255,0.78);
    }

    /* Estado: já instalado */
    .pwa-bar-installed {
      text-align: center;
      font-size: 0.68rem;
      color: var(--text-muted);
      padding: 6px 0;
      opacity: 0.6;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    /* PWA install hint na tela de login (legado — oculto) */
    .pwa-login-hint {
      margin-top: var(--space-4);
      padding: var(--space-3) var(--space-4);
      background: rgba(91,222,62,0.06);
      border: 1px solid rgba(91,222,62,0.18);
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      gap: var(--space-3);
      font-size: 0.8125rem;
      color: var(--text-secondary);
      animation: fadeIn 0.5s ease 1s both;
      position: relative;
    }

    .pwa-login-hint img {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      flex-shrink: 0;
    }

    .pwa-login-hint .hint-text {
      flex: 1;
      min-width: 0;
      font-size: 0.75rem;
      line-height: 1.4;
    }

    .pwa-login-hint .hint-title {
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 2px;
      font-size: 0.8125rem;
    }

    .pwa-login-hint .hint-install-btn {
      flex-shrink: 0;
      padding: 6px 12px;
      background: linear-gradient(135deg, #5BDE3E, #3fcf1e);
      border: none;
      border-radius: 8px;
      color: #0A0A0A;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      font-family: inherit;
      transition: opacity .15s, transform .15s;
      white-space: nowrap;
    }

    .pwa-login-hint .hint-install-btn:hover {
      opacity: .9;
      transform: translateY(-1px);
    }

    .pwa-login-hint .hint-dismiss {
      position: absolute;
      top: 6px;
      right: 8px;
      background: none;
      border: none;
      color: rgba(255,255,255,.3);
      cursor: pointer;
      font-size: 0.7rem;
      padding: 2px;
      line-height: 1;
      font-family: inherit;
      transition: color .15s;
    }

    .pwa-login-hint .hint-dismiss:hover { color: rgba(255,255,255,.7); }
  </style>
</head>
<body>
  <!-- Background orbs -->
  <div class="orb orb-1" aria-hidden="true"></div>
  <div class="orb orb-2" aria-hidden="true"></div>

  <main class="login-wrapper" role="main">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <div class="brand">
          <div class="logo-mark" aria-hidden="true">
            <img src="/img/logo_original_backup.png" alt="PROSPEKT">
          </div>
          <span class="brand-name">PROSPEKT</span>
        </div>
        <p class="login-title">Entre na sua conta para continuar</p>
      </div>
      <!-- Error -->
      <div id="login-error" role="alert" aria-live="polite">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="login-error-msg">Erro de autenticação</span>
      </div>

      <!-- Form -->
      <form id="login-form" class="login-form" novalidate>
        <!-- Email -->
        <div class="input-group">
          <label class="input-label" for="email">Email</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
            </svg>
            <input
              id="email"
              name="email"
              type="email"
              class="input"
              placeholder="seu@email.com"
              autocomplete="email"
              required
              autofocus
            >
          </div>
        </div>

        <!-- Senha -->
        <div class="input-group">
          <label class="input-label" for="senha">Senha</label>
          <div class="input-with-icon">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input
              id="senha"
              name="senha"
              type="password"
              class="input"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-password" id="toggle-senha" aria-label="Mostrar/ocultar senha">
              <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn btn-primary btn-lg" id="btn-login">
          <span id="btn-text">Entrar</span>
          <div class="spinner hidden" id="btn-spinner"></div>
        </button>
      </form>

      <!-- Footer -->
      <div class="login-footer">
        <span class="version">
          <span class="version-dot"></span>
          PROSPEKT CRM v1.0 &nbsp;·&nbsp; Sistema seguro
        </span>
        <div style="margin-top:8px;font-size:0.6875rem;color:var(--text-muted);opacity:0.55;letter-spacing:0.02em;">
          Powered by <span style="color:var(--text-secondary);opacity:0.8;font-weight:500;">UP SALES System™</span>
        </div>
      </div>
    </div>

    <!-- ── PWA Install Bar ───────────────────────────────────── -->
    <div id="pwa-install-bar" style="display:none;"></div>

  </main>

  <div id="toast-container" aria-live="polite"></div>

  <script src="/js/auth.js"></script>
  <script src="/js/toast.js"></script>
  <script>
    // Redireciona se já logado
    Auth.redirecinarSeLogado();

    // Toggle password visibility
    document.getElementById('toggle-senha').addEventListener('click', () => {
      const input  = document.getElementById('senha');
      const isText = input.type === 'text';
      input.type = isText ? 'password' : 'text';
      document.getElementById('eye-icon').innerHTML = isText
        ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
        : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    });

    // Form submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const errEl = document.getElementById('login-error');
      const errMsg = document.getElementById('login-error-msg');
      const btnText = document.getElementById('btn-text');
      const spinner = document.getElementById('btn-spinner');
      const btn = document.getElementById('btn-login');

      // Reset error
      errEl.classList.remove('visible');

      // Validate
      if (!email || !senha) {
        errMsg.textContent = 'Por favor, preencha email e senha.';
        errEl.classList.add('visible');
        return;
      }

      // Loading state
      btn.disabled = true;
      btnText.textContent = 'Entrando...';
      spinner.classList.remove('hidden');

      try {
        const result = await Auth.login(email, senha);

        if (result.sucesso) {
          if (result.deve_trocar_senha) {
            // Primeiro acesso — redireciona para troca de senha obrigatória
            Toast.show('Bem-vindo(a)! Por segurança, crie sua senha pessoal.', 'info');
            setTimeout(() => {
              window.location.href = '/trocar-senha.html?email=' + encodeURIComponent(email);
            }, 1200);
          } else {
            Toast.show('Bem-vindo! Redirecionando...', 'success');
            setTimeout(() => { window.location.href = '/dashboard.html'; }, 800);
          }
        } else {
          errMsg.textContent = result.erro || 'Credenciais inválidas.';
          errEl.classList.add('visible');
          document.getElementById('senha').classList.add('error');

          // Shake animation
          const card = document.querySelector('.login-card');
          card.style.animation = 'none';
          card.offsetHeight;
          card.style.animation = 'shake 0.4s ease';
        }
      } catch (err) {
        errMsg.textContent = 'Erro de conexão. Tente novamente.';
        errEl.classList.add('visible');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Entrar';
        spinner.classList.add('hidden');
      }
    });

    // Limpa erro ao digitar
    ['email','senha'].forEach(id => {
      document.getElementById(id).addEventListener('input', () => {
        document.getElementById('login-error').classList.remove('visible');
        document.getElementById(id).classList.remove('error');
      });
    });
  </script>

  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25%       { transform: translateX(-8px); }
      75%       { transform: translateX(8px); }
    }
  </style>

<script>
  // ── PWA Install Bar — Tela de Login ────────────────────────────────────────
  (function () {
    const bar = document.getElementById('pwa-install-bar');
    if (!bar) return;

    // Detecta plataforma
    const ua           = navigator.userAgent;
    const isIOS        = /iphone|ipad|ipod/i.test(ua);
    const isAndroid    = /android/i.test(ua);
    const isSafariOnly = /^((?!chrome|android|crios|fxios).)*safari/i.test(ua);
    const isStandalone = (window.navigator.standalone === true)
                       || window.matchMedia('(display-mode: standalone)').matches;
    const alreadyInstalled = localStorage.getItem('pwa_installed') === '1';
    const dismissed        = localStorage.getItem('pwa_bar_dismissed') === '1';

    // Se já rodando como PWA instalado: não exibir nada
    if (isStandalone) return;

    // Se já instalado: mostrar badge discreto
    if (alreadyInstalled) {
      bar.innerHTML = '<div class="pwa-bar-installed"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> CRM instalado neste dispositivo</div>';
      bar.style.display = '';
      return;
    }

    // Se dispensado: não mostrar
    if (dismissed) return;

    function dismiss() {
      localStorage.setItem('pwa_bar_dismissed', '1');
      bar.style.display = 'none';
    }

    // ── iOS/Safari: instrução manual ────────────────────────────
    if (isIOS && isSafariOnly) {
      bar.innerHTML = `
        <div class="pwa-bar-ios">
          <button class="pwa-bar-dismiss" id="pwa-bar-x" aria-label="Fechar">✕</button>
          <div class="pwa-bar-ios-title">📲 Instale o PROSPEKT CRM no iPhone</div>
          <div class="pwa-bar-ios-steps">
            1. Toque em <strong>⎋ Compartilhar</strong> no Safari<br>
            2. Role para baixo e toque em <strong>Adicionar à Tela de Início</strong>
          </div>
        </div>`;
      bar.style.display = '';
      document.getElementById('pwa-bar-x').addEventListener('click', dismiss);
      return;
    }

    // ── Chrome / Edge / Android: beforeinstallprompt ─────────────
    // O evento pode já ter sido capturado pelo script do <head>
    function renderInstallBtn() {
      bar.innerHTML = `
        <button class="pwa-bar-btn" id="pwa-bar-btn" aria-label="Instalar PROSPEKT CRM">
          <img class="pwa-bar-icon" src="/icons/icon-192.png" alt="">
          <div class="pwa-bar-text">
            <div class="pwa-bar-title">Instalar PROSPEKT CRM</div>
            <div class="pwa-bar-sub">Acesse como app — sem abrir o navegador</div>
          </div>
          <div class="pwa-bar-cta">↓ Instalar</div>
          <button class="pwa-bar-dismiss" id="pwa-bar-x" aria-label="Fechar">✕</button>
        </button>`;
      bar.style.display = '';

      document.getElementById('pwa-bar-x').addEventListener('click', function(e) {
        e.stopPropagation();
        dismiss();
      });

      document.getElementById('pwa-bar-btn').addEventListener('click', async function() {
        const prompt = window.__pwaPrompt;
        if (!prompt) return;
        prompt.prompt();
        const { outcome } = await prompt.userChoice;
        if (outcome === 'accepted') {
          localStorage.setItem('pwa_installed', '1');
          bar.innerHTML = '<div class="pwa-bar-installed"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Instalando...</div>';
        } else {
          bar.style.display = 'none';
        }
        window.__pwaPrompt = null;
      });
    }

    // Se o prompt já foi capturado (evento disparou antes deste script)
    if (window.__pwaPrompt) {
      renderInstallBtn();
    } else {
      // Aguarda o evento (se ainda não disparou)
      document.addEventListener('pwa-ready', function() {
        renderInstallBtn();
      }, { once: true });
    }

    // Reage ao evento appinstalled (confirmação do SO)
    document.addEventListener('pwa-installed', function() {
      bar.innerHTML = '<div class="pwa-bar-installed"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> CRM instalado com sucesso!</div>';
      bar.style.display = '';
    }, { once: true });

    // Registra Service Worker (necessário para PWA instalável)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function() {});
    }
  })();
</script>
</body>
</html>
